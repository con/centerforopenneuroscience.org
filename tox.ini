[tox]
envlist = py3,lint
skipsdist = true

[testenv]
skip_install = true
deps =
    pytest>=7.0
    pytest-timeout>=2.0
    pyyaml
    # the navigation tests build the site, because the sidebar and the
    # in-page anchors only exist after the ToC extension has run
    pelican
    markdown
    beautifulsoup4
commands = pytest {posargs:tests/}

[testenv:lint]
skip_install = true
deps = ruff>=0.1.0
commands = ruff check scripts/ tests/

[pytest]
markers =
    ai_generated: test written by an AI assistant
timeout = 300
