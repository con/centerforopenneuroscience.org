[tox]
envlist = py3,lint
skipsdist = true

[testenv]
skip_install = true
deps =
    pytest>=7.0
    pytest-timeout>=2.0
    pyyaml
commands = pytest {posargs:tests/}

[testenv:lint]
skip_install = true
deps = ruff>=0.1.0
commands = ruff check scripts/ tests/

[pytest]
markers =
    ai_generated: test written by an AI assistant
timeout = 300
