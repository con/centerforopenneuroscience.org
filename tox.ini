[tox]
envlist = py3,lint,projection,html
skipsdist = true

[testenv]
skip_install = true
deps =
    pytest>=7.0
    pytest-timeout>=2.0
    pyyaml
    # the navigation tests build the site, because the sidebar and the
    # in-page anchors only exist after the ToC extension has run
    pelican
    markdown
    beautifulsoup4
    # the navigation test drives a real browser: the sidebar's behaviour
    # lives in scrollspy and CSS, not in the markup
    playwright
# CI sets it so that a missing browser fails the browser tests, not skips them
passenv = CON_REQUIRE_BROWSER
commands = pytest {posargs:tests/}

[testenv:lint]
skip_install = true
deps = ruff>=0.1.0
commands = ruff check scripts/ tests/

# The committed whoweare/projects pages are what the pinned store renders, and
# the theme holds every logo and portrait at the store's size -- i.e. nobody
# advanced the store without `make run-project`.  Writes nothing; needs the
# store's annexed media (`git -C sourcedata/con-site-specific annex get content`).
[testenv:projection]
skip_install = true
deps = pyyaml
passenv = CON_RECORD_STORE
commands = python scripts/check_projection.py

# Pelican's ToC extension silently drops every anchor of a page that is not
# well-formed XML, so the content pages must parse.
[testenv:html]
skip_install = true
deps =
commands = python scripts/validate_html.py content/

[pytest]
markers =
    ai_generated: test written by an AI assistant
timeout = 300
