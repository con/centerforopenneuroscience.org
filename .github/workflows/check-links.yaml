---
name: Check Links

on:
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 0 * * 0'  # every sunday 00:00 UTC

jobs:
  check_links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install requirements and fetch annexed content
        run: |
          # to please git/git-annex
          git config --global user.email "CI@example.com"
          git config --global user.name "CI almighty"
          # retry transient download failures.  No annex.jobs: the get is
          # bound by a few large files, and was slower with 3 jobs
          git config --global annex.retry 5
          pip install pelican linkchecker git-annex
          # theme images are annexed; without their content the server
          # gets dangling symlinks and every logo fails the check.
          # We do not autoenable that remote, so add it here.
          git remote add --fetch datasets.datalad.org \
              http://datasets.datalad.org/centerforopenneuroscience/con.org/.git/
          git annex get theme/static

      - name: Validate content HTML (XML well-formedness)
        run: python3 scripts/validate_html.py content/

      - name: Start server
        run: |
          make html
          make serve &
          echo $! > server.pid
          sleep 1

      - name: Check links
        run: |
          # some sites forbid robots to access them
          linkchecker --check-extern -f .linkcheckerrc -t 1 \
            http://localhost:8000

      - name: Stop Website Server
        run: |
          kill $(cat server.pid)
