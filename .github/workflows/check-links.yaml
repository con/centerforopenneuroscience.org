---
name: Check Links

on:
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 0 * * 0'  # every sunday 00:00 UTC

jobs:
  check_links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Requirements
        run: |
          pip install pelican linkchecker

      - name: Validate content HTML (XML well-formedness)
        run: python3 scripts/validate_html.py content/

      - name: Start server
        run: |
          make html
          make serve &
          echo $! > server.pid
          sleep 1

      - name: Check links
        run: |
          # some sites forbid robots to access them
          linkchecker --check-extern -f .linkcheckerrc -t 1 \
            http://localhost:8000

      - name: Stop Website Server
        run: |
          kill $(cat server.pid)
