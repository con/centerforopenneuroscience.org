# Which graphs /explore/ and the per-person graphs can show.
#
# The first source is this site: scripts/render_graph.py writes its graph to
# content/graph/graph.json from the record store.  Every other source is
# another site's own graph, which the browser loads FROM THAT SITE when a
# reader asks for it and joins with ours (theme/static/js/con-graph.js; the
# rules are in scripts/congraph.py).  Nothing of theirs is built into ours.
sources:
  - id: con
    label: CON
    base_url: https://centerforopenneuroscience.org
    match_local_paths: true

  - id: psyinf
    label: Psychoinformatics
    base_url: https://www.psychoinformatics.de
    # the site's own graph, as its /explore page loads it; it is served
    # with Access-Control-Allow-Origin: *, which loading it from here needs
    graph_url: https://www.psychoinformatics.de/graph.json
    # a saved copy under content/graph/, used only when the site cannot be
    # reached; `make fetch-graphs` refreshes it
    fallback: psyinf.json
    # The two sites name shared people, projects and objectives alike
    # (persons/adina-wagner, projects/datalad, objectives/<same uuid>).
    match_local_paths: true
    # Their graph holds every publication of the institute; keep what lies
    # within two links of the site's root -- the group's people and
    # projects, and what those made -- which is what the site itself shows.
    within: 2

# A thing of ours that another store describes under a different pid is
# joined by `exact_mappings` in its con-site-specific record, not here.
