description_html: "\n      John brings together research imaging, open-source infrastructure, and an industry\
  \ engineering perspective.\n      His work spans NIH neuroimaging data sharing, AFNI testing infrastructure,\n\
  \      consulting and independent software work, and reproducible biomedical image transformation. At\
  \ CON, he works\n      on building and applying the center's tools for reproducibility and provenance\
  \ tracking to healthcare image data,\n      with an interest in auditable autonomous systems for scientific\
  \ research and clinical translation.\n    "
