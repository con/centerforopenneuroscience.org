description_html: "\n      Dr. Wager and his lab have a dedication toward developing\n      analysis methods\
  \ for functional neuroimaging and sharing ideas,\n      tools, and scientific data with the scientific\
  \ community and\n      public.  At the moment Tor is also\n      leading <a href=\"https://www.dartmouth.edu/dbic/\"\
  >Dartmouth\n      Brain Imaging Center (DBIC)</a> where CON pilots various\n      deployments and automations\
  \ to improve efficiency and\n      reproducibility in the neuroimaging, and\n      the <a href=\"https://www.dartmouth.edu/ccn/\"\
  >Center for\n      Cognitive Neuroscience</a>.\n      "
