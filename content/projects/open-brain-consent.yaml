body_html: "\n\t<figure>\n      <a href=\"https://open-brain-consent.readthedocs.io/\"><img src=\"/theme/img/3rd/obc_logo.svg\"\
  \n      alt=\"Open Brain Consent\" class=\"pull-right\" style=\"width:155px;padding-left:5px;margin-top:0em;\"\
  \ /></a>\n    </figure>\n\n\t<p>\n\t  <a href=\"http://open-brain-consent.readthedocs.org\">Open Brain\n\
  \t  Consent</a> initiative aims to facilitate neuroimaging data\n\t  sharing by providing an \"out of\
  \ the box\" solution addressing\n\t  aforementioned human subjects concerns and consisting of\n\t</p>\n\
  \t  <ul>\n\t\t<li>widely acceptable consent form allowing deposition of\n\t\t  anonymized data to public\
  \ data archives</li>\n\t\t<li>collection of tools/pipelines to help anonymization of\n\t\t  neuroimaging\
  \ data making it ready for sharing</li>\n\t  </ul>\n\n\t<p>Initiated and managed by CON, OBC is now\
  \ an international\n\teffort with materials for GDPR compliance and multiple\n\tinternationalization\
  \ efforts to make sure materials are available\n\tin all applicable\n\tlanguages. <a href=\"https://github.com/con/open-brain-consent/blob/master/CONTRIBUTING.rst\"\
  >Contribute</a>\n\tif you see your language is missing!</p>\n\t<ul>\n\t  <li>\n\t\tBannier E, Barker\
  \ G, Borghesani V, Broeckx N, Clement P,\n\t\tEmblem KE, Ghosh S, Glerean E, Gorgolewski KJ, Havu\n\t\
  \tM, <a href=\"/whoweare#yaroslav_o_halchenko_\"\n\t\tclass=\"centroid\">Halchenko YO</a>, Herholz P,\
  \ Hespel A, Heunis\n\t\tS, Hu Y, Hu CP, Huijser D, de la Iglesia Vayá M, Jancalek R,\n\t\tKatsaros VK,\
  \ Kieseler ML, Maumet C, Moreau CA, Mutsaerts HJ,\n\t\tOostenveld R, Ozturk-Isik E, Pascual Leone Espinosa\
  \ N, Pellman\n\t\tJ, Pernet CR, Pizzini FB, Trbalić AŠ, Toussaint PJ, <a href=\"/whoweare#matteo_visconti_di_oleggio_castello_\"\
  \n\t\tclass=\"centroid\">Visconti\n\t\tdi Oleggio Castello M</a>, Wang F, Wang C, Zhu H. <emph>The Open\n\
  \t\tBrain Consent: Informing research participants and obtaining\n\t\tconsent to share brain imaging\
  \ data</emph>. Hum Brain\n\t\tMapp. 2021 May;42(7):1945-1951. doi: <a href=\"http://doi.org/10.1002/hbm.25351\"\
  >10.1002/hbm.25351</a>. Epub 2021 Feb 1. PMID: 33522661; PMCID: PMC8046140.\n\t  </li>\n\t</ul>\n  "
