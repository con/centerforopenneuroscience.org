body_html: "\n\t<figure>\n      <a href=\"https://datalad.org\"><img src=\"/theme/img/3rd/duecredit_logo.png\"\
  \ alt=\"DueCredit\" class=\"pull-left\" style=\"width:155px;padding-right:10px;margin-top:0em;\" /></a>\n\
  \    </figure>\n\t<p>\n\t  <a href=\"https://github.com/duecredit/duecredit\">DueCredit</a>\n\t  provides\
  \ solution for the problem of inadequate citation and\n\t  referencing of scientific software and methods.\
  \  It provides a\n\t  simple framework (at the moment for Python only) to embed\n\t  publication or\
  \ other references in the original code so they are\n\t  automatically collected and reported to the\
  \ user at the\n\t  necessary level of reference detail, i.e. only references for\n\t  actually used\
  \ functionality will be presented back if software\n\t  provides multiple citeable implementations.\n\
  \t</p>\n\t<p>\n\t  As a side-effect, we hope that DueCredit also will reduce demand\n\t  in \"prima-ballerina\"\
  \ projects, will encourage contributions to\n\t  existing open-source codebases, and as a result would\
  \ solidify\n\t  scientific software ecosystem.\n\t</p>\n\t<ul>\n\t  <li>\n\t\t<a href=\"/whoweare#yaroslav_o_halchenko_\"\
  \ class=\"centroid\">Y.O. Halchenko</a>\n\t\tand\n\t\t<a href=\"/whoweare#matteo_visconti_di_oleggio_castello_\"\
  \ class=\"centroid\">M. Visconti di Oleggio Castello</a>\n\t\t(2016).\n\t\t<a href=\"http://haxbylab.dartmouth.edu/publications/HV+OHBM16.pdf\"\
  >\n\t\t  DueCredit - automagically collect citations for software,\n\t\t  methods, and data you use.\n\
  \t\t</a> OHBM 2016, Geneva, Switzerland\n\t  </li>\n\t</ul>\n  "
