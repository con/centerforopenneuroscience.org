section_html: <h1>Meetings</h1>
section_intro_html: "\n\n  For over a decade, CON and its projects are presented annually with\n  exhibits\
  \ at\n  the annual meetings of\n  the <a href=\"https://www.humanbrainmapping.org\">Organization for\n\
  \  Human Brain Mapping (OHBM) Society</a>\n  and the <a href=\"https://www.sfn.org\">Society for Neuroscience</a>.\n\
  \  In collaboration with <a href=\"/whoweare#soichi_hayashi_\"\n  class=\"centroid\">Soichi Hayashi</a>\
  \ and <a href=\"https://github.com/datalad-datasets/ohbm2020-posters/graphs/contributors\">other wonderful\n\
  \  people</a> we proudly saved the first ever virtual OHBM 2020 by\n  providing\n  a <a href=\"https://datalad-datasets.github.io/ohbm2020-posters/#/\"\
  >virtual\n  posters venue</a>.\n\t\n\t"
