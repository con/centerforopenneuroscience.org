body_html: "\n    <figure>\n      <a href=\"https://github.com/ReproNim/containers\"><img src=\"/theme/img/3rd/repronim-containers-1-single-wide.svg\"\
  \ alt=\"ReproNim/containers\" class=\"pull-left\" style=\"width:400px;padding-right:10px;margin-top:0em;\"\
  \ /></a>\n    </figure>\n\t<p>\n\t  <a href=\"https://github.com/ReproNim/containers\">ReproNim/containers</a>\n\
  \t  is a <a href=\"#datalad\">DataLad</a> dataset providing a ready-to-use\n\t  \"distribution\" of\
  \ containerized neuroimaging environments (Singularity\n\t  images) for reproducible analysis. It collects\
  \ a curated set of\n\t  containers — including those used by <a href=\"#heudiconv\">HeuDiConv</a>\n\t\
  \  and the broader <a href=\"http://repronim.org\">ReproNim</a> ecosystem —\n\t  and exposes them via\
  \ the <code>///repronim/containers</code> DataLad\n\t  dataset path, making it trivial to pin and share\
  \ exact software\n\t  environments alongside data and workflows.\n\t</p>\n  "
