  \ alt=\"DataLad-Registry\"\n             class=\"pull-right\"\n             style=\"height:4.4em;padding-left:1em;margin-top:-0.3em;\"\
  /></a>\n    </figure>\n    <p>\n      <a href=\"https://registry.datalad.org\">DataLad-Registry</a>\
  \ is a service that\n      maintains up-to-date information on an expanding collection of datasets,\
  \ currently\n      numbering over ten thousand. It automatically registers datasets from various\n \
  \     online sources, extracts metadata, and keeps both the datasets and their metadata\n      current.\
  \ DataLad-Registry offers search functionalities, including metadata-based\n      searches, accessible\
  \ through both a web interface and a RESTful\n      API.\n\t  Registry is regularly updated with DataLad\
  \ datasets discovered across\n      multiple hosting portals and listed on our\n\t  <a href=\"https://github.com/datalad/datalad-usage-dashboard/\"\
  >DataLad Usage Dashboard</a>.\n    </p>\n    <ul>\n      <li>\n        \U0001F3AC <a href=\"https://datasets.datalad.org/repronim/ReproTube/web/#/channel/DataLad/video/_McJ1BtLsiQ\"\
  >Talk\n        at distribits 2024: Bringing Benefits of Centrality to DataLad</a>\n      </li>\n   \
  \ </ul>\n  "
