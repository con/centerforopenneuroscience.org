body_html: "\n\t<figure>\n      <a href=\"https://openneuro.org\"><img src=\"/theme/img/3rd/openneuro_logo.png\"\
  \ alt=\"OpenNeuro\" class=\"pull-left\" style=\"width:155px;padding-right:5px;margin-top:0em;\" /></a>\n\
  \    </figure>\n\t<p>\n\t  <a href=\"https://openneuro.org\">OpenNeuro</a>\n\t  is likely the oldest\
  \ and the most well known <a href=\"https://braininitiative.nih.gov/\">BRAIN\n\t  Initiative</a> archive\
  \ for neuroimaging data.\n\t  One of the exciting features of the project is that being inspired by\n\
  \t  our\t  early <a href=\"https://datasets.datalad.org/?dir=/openfmri\">DataLad\n\t  crawling</a> of\n\
  \t  its <a href=\"https://openfmri.org/\">OpenfMRI.org</a> precursor,\n\t  it is now\n\t  using <a href=\"\
  https://git-annex.branchable.com\">git-annex</a>\n\t  directly as its core technology.\n\t  CON is contributing\
  \ in ensuring availability of recent versions\n\t  of git-annex and DataLad, involved standardization\
  \ efforts, and inter-archive collaborations.\n\t</p>\n\t<ul>\n\t  <li>\n\t\t<a href=\"https://reporter.nih.gov/project-details/10881961\"\
  >NIH (#5R24MH117179-07)</a>. PI:\n\t\t<a href=\"https://profiles.stanford.edu/russell-poldrack\">R.\
  \ Poldrack</a>, Co-I:\n \t\t<a href=\"/whoweare#yaroslav_o_halchenko_\" class=\"centroid\">Y.O. Halchenko</a>\n\
  \t  </li>\n\t  <li>\n\t\t<a href=\"https://github.com/OpenNeuroStudies/OpenNeuroStudies\">OpenNeuroStudies</a>:\n\
  \t\ta <a href=\"#datalad\">DataLad</a> superdataset organising OpenNeuro datasets\n\t\tinto BIDS Study\
  \ structure together with their derivatives.\n\t  </li>\n\t</ul>\n  "
