body_html: "\n\t<p>\n\t  <a href=\"https://github.com/con/mechababs\">mechababs</a> runs\n\t  <a href=\"\
  https://bids-apps.neuroimaging.io\">BIDS Apps</a> over many\n\t  studies on an HPC cluster, with\n\t\
  \  <a href=\"https://github.com/PennLINC/babs\">BABS</a> running the jobs.\n\t  It works on a BIDS study,\
  \ adding derivatives to it, and records how\n\t  each one was made inside the study itself: the exact\
  \ mechababs and\n\t  BABS versions pinned in a lock, and every orchestration step as a\n\t  <a href=\"\
  #datalad_\">DataLad</a> run record.  A superstudy groups\n\t  many studies so one campaign sweeps them\
  \ all, which is how mechababs\n\t  feeds <a href=\"https://github.com/OpenNeuroStudies/OpenNeuroStudies\"\
  >OpenNeuroStudies</a>.\n\t</p>\n  "
