  \n\t    <p>\n\t        <a href=\"https://github.com/con/duct\">con/duct</a>\n          (or just duct)\
  \ is a lightweight wrapper that collects execution data for an\n          arbitrary command.  Execution\
  \ data includes execution time, system\n          information, and resource usage statistics of the\
  \ command and all its\n          child processes.\n\n          duct is intended to simplify the problem\
  \ of recording the resources\n          necessary to execute a command, particularly in an HPC environment.\n\
  \          Additionally duct includes optional helpers that interact with\n          logs produced by\
  \ duct exectutions.\n\t    </p>\n  "
