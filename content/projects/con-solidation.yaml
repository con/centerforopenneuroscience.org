body_html: "\n\t<p>\n\t  <a href=\"https://github.com/con/solidation\">con/solidation</a> is a command-line\n\
  \t  tool that produces a Markdown activity report of recent issue and pull-request\n\t  events across\
  \ a configured set of GitHub repositories and organizations. It is\n\t  used by CON to generate regular\
  \ summaries of activity across the projects it\n\t  maintains and contributes to, enabling lightweight\
  \ project-health monitoring\n\t  without leaving the terminal.\n\t</p>\n  "
