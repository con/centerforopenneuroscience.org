body_html: "\n\t<p>\n\t  <a href=\"https://github.com/con/fscacher\">con/fscacher</a> is a Python library\n\
  \t  providing a persistent, file-content-aware memoization cache. Functions decorated\n\t  with <code>@cache.memoize_path</code>\
  \ are re-executed only when the fingerprint\n\t  (timestamps + size) of their file arguments changes\
  \ — making it easy to cache\n\t  expensive operations on large file trees without stale results.\n\t\
  \  It is used internally by the <a href=\"#dandi\">DANDI</a> client and other CON tools.\n\t</p>\n  "
