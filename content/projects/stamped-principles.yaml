body_html: "\n\t<figure>\n      <a href=\"https://stamped-principles.org\">\n\t\t<img src=\"/theme/img/3rd/stamped_logo.png\"\
  \ alt=\"STAMPED\"\n\t\t\t class=\"pull-right\"\n\t\t\t style=\"width:255px;padding-left:10px;margin-top:-2em;\"\
  \ />\n\t  </a>\n    </figure>\n\t<p>\n\t  <a href=\"https://stamped-principles.org\">STAMPED</a> is\
  \ a set of\n\t  seven principles, Self-containment, Tracking, Actionability,\n\t  Modularity, Portability,\
  \ Ephemerality, and Distributability, for\n\t  building research objects that others can trust, rerun,\
  \ and build\n\t  upon.  Each principle is a spectrum from a practical minimum to an\n\t  aspirational\
  \ ideal, so adoption can be incremental and start from\n\t  existing practice.  STAMPED grew out of\
  \ <a href=\"https://f1000research.com/posters/7-1965\">YODA</a> and\n\t  comes with an\n\t  <a href=\"\
  https://checklist.stamped-principles.org\">interactive checklist</a>\n\t  and <a href=\"https://examples.stamped-principles.org\"\
  >worked examples</a>.\n\t</p>\n\t<ul>\n\t  <li>\n\t\t<a href=\"/whoweare#austin_macdonald_\" class=\"\
