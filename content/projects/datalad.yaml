body_html: "\n\t<figure>\n      <a href=\"https://datalad.org\">\n\t\t<img src=\"/theme/img/3rd/datalad_logo.png\"\
  \ alt=\"DataLad\" class=\"pull-right\" style=\"width:255px;padding-left:5px;margin-top:-2em;\" /></a>\n\
  \    </figure>\n\t<p>\n\t  <a href=\"https://datalad.org\">DataLad</a> is ongoing work funded\n\t  by\
  \ NSF and German BMBF, to adapt the model of open-source\n\t  software (OSS) distributions to address\
  \ the technical\n\t  limitations of today's data-sharing and provides a versatile\n\t  data management\
  \ platform.  It uses software for data tracking and\n\t  deployment logistics specialized for large\
  \ data\n\t  (<a class=\"reference external\" href=\"http://git-annex.branchable.com\">git-annex</a>)\
  \ built\n\t  atop <a class=\"reference external\" href=\"http://git-scm.com\">Git</a>, the most capable\
  \ distributed\n\t  version control system (dVCS) available today. DataLad provides\n\t  access to data\
  \ available from various sources (e.g. lab or\n\t  consortium web-sites such as <a class=\"reference\
  \ external\"\n\t  href=\"http://humanconnectome.org\">humanconnectome.org</a>;\n\t  data sharing portals\
  \ such as <a class=\"reference external\" href=\"http://openneuro.org\">openneuro.org</a>\n\t  and <a\
  \ class=\"reference external\" href=\"http://crcns.org\">crcns.org</a>) through a single\n\t  interface.\
  \ It enables students and scientists to operate on data\n\t  using familiar concepts, such as files\
  \ and directories, while\n\t  transparently managing data access and authorization with underlying\n\
  \t  hosting providers.\n\t</p>\n\t<ul>\n\t  <li>\n\t\t  <a href=\"/whoweare#michael_hanke_\" class=\"\
  centroid\">M. Hanke</a>,\n\t\t  <a href=\"/whoweare#matteo_visconti_di_oleggio_castello_\" class=\"\
  centroid\">M. Visconti di Oleggio Castello</a>,\n\t\t  <a href=\"/whoweare#kyle_meyer_\" class=\"centroid\"\
  >K. Meyer</a>,\n\t\t  <a href=\"/whoweare#benjamin_poldrack_\" class=\"centroid\">B. Poldrack</a>,\n\
  \t\t  and\n\t\t  <a href=\"/whoweare#yaroslav_o_halchenko_\" class=\"centroid\">Y.O. Halchenko</a>\n\
  \t\t  (2018). <a href=\"https://github.com/myyoda/poster/blob/master/ohbm2018.pdf\">YODA: YODA's organigram\
  \ on data\n\t\t\tanalysis.</a> OHBM 2018, Singapore.\n\t  </li>\n\t  <li>\n\t\t<a href=\"https://doi.org/10.21105/joss.03262\"\
  >JOSS\n\t\tpaper</a>: providing a succinct overview of\n\t\tDataLad\n\t  </li>\n\t  <li>\n\t\t<a href=\"\
  http://handbook.datalad.org\">DataLad Handbook</a>:\n\t\teverything you need to know about DataLad.\n\
  \t  </li>\n\t  <li> <a href=\"https://www.datalad.org/#supporting-datalad\">Funding support</a> </li>\n\
  \t  <li>\n\t\t<a href=\"https://github.com/datalad/datalad-container\">datalad-container</a>:\n\t\t\
  a DataLad extension for working with containerized computational environments.\n\t\tIt enables version-controlled\
  \ execution of containerized pipelines (Singularity,\n\t\tDocker, and others) with full provenance capture\
  \ as DataLad run records.\n\t  </li>\n\t  <li>\n\t\t<a href=\"https://github.com/datalad/datalad-fuse\"\
  >datalad-fuse</a>:\n\t\ta DataLad extension to read annexed files from their remote URLs without a full\n\
  \t\tdownload — sparse fetching via <a href=\"https://github.com/fsspec/filesystem_spec\">fsspec</a>\n\
  \t\tand optional FUSE mount give immediate access to petabyte-scale datasets.\n\t  </li>\n\t</ul>\n\n\
  \  "
