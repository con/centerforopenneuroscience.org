body_html: "\n\t<figure>\n      <a href=\"http://bids.neuroimaging.io\">\n\t\t<img src=\"/theme/img/3rd/bids_logo.png\"\
  \ alt=\"BIDS\"\n\t\t\t class=\"pull-right\"\n\t\t\t style=\"width:255px;padding-left:10px;margin-top:-2em;\"\
  \ />\n\t  </a>\n    </figure>\n\t<p>\n\t  <a href=\"http://bids.neuroimaging.io\">BIDS</a> is a\n\t\
  \  project lead by a steering group elected by the BIDS community\n    to provide a simple and intuitive\
  \ way to organize and describe your\n\t  neuroimaging and behavioral data.\n\t</p>\n\t<ul>\n\t  <li>\n\
  \t\tGorgolewski, K. J., et many,\n\t\t<a href=\"/whoweare#yaroslav_o_halchenko_\" class=\"centroid\"\
  >Y.O. Halchenko</a>\n\t\tet many more (2016).\n\t\t<a href=\"http://www.nature.com/articles/sdata201644\"\
  >The brain imaging data structure, a format for organizing and describing outputs of neuroimaging experiments.</a>\n\
  \t\tScientific Data, 3. DOI: 10.1038/sdata.2016.44\n\t  </li>\n\t  <li>\n\t\t<a href=\"https://github.com/bids-standard/bids-examples\"\
  >Example (test)\n\t\t  datasets</a>\n\t  </li>\n\t  <li>\n\t\t<a href=\"http://datasets.datalad.org/?dir=/openfmri\"\
  >Historical OpenfMRI</a> and up-to-date\n\t\t<a href=\"http://datasets.datalad.org/?dir=/openneuro\"\
  >OpenNeuro</a>\n\t\tDatasets in DataLad distribution.\n\t  </li>\n\t  <li>\n\t\t<a href=\"https://github.com/bids-dandisets\"\
  >bids-dandisets</a>:\n\t\ta GitHub organization hosting individual DANDI dandisets converted to BIDS\
  \ format\n\t\tusing <a href=\"#nwb\">con/nwb2bids</a>, with a\n\t\t<a href=\"https://github.com/bids-dandisets/dashboard\"\
  >conversion dashboard</a>\n\t\ttracking the status across all dandisets.\n\t  </li>\n\t</ul>\n  "
