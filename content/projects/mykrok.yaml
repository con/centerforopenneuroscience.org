  \ />\n\t  </a>\n    </figure>\n\t<p>\n\t  <a href=\"https://github.com/mykrok/mykrok\">MyKrok</a> (Ukrainian:\
  \ \"мій крок\" — \"my step\")\n\t  is a CLI tool to incrementally back up fitness activities from\n\t\
  \  <a href=\"https://www.strava.com\">Strava</a>, including GPS tracks, photos, comments, and kudos.\n\
  \t  Backups are browsable offline through a built-in web frontend with interactive maps and\n\t  activity\
  \ statistics — applying the same git-annex / open-data philosophy of CON's\n\t  archival tools to personal\
  \ fitness data.\n\t  Try the <a href=\"https://mykrok.github.io/mykrok/\">live demo</a> with synthetic\
  \ data.\n\t</p>\n  "
