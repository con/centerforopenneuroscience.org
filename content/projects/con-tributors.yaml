body_html: "\n\t<figure>\n      <a href=\"https://con.github.io/tributors/\">\n\t\t<img src=\"/theme/img/3rd/tributors_logo.png\"\
  \ alt=\"tributors\"\n\t\t\t class=\"pull-right\"\n\t\t\t style=\"width:120px;padding-left:5px;margin-top:-1em;\"\
  \ />\n\t  </a>\n    </figure>\n\t<p>\n\t  <a href=\"https://github.com/con/tributors\">con/tributors</a>\
  \ is a Python library\n\t  and GitHub Action to automate maintenance of contributor attribution files.\n\
  \t  It updates <a href=\"https://allcontributors.org\">all-contributors</a>,\n\t  <a href=\"https://zenodo.org\"\
  >Zenodo</a> metadata (.zenodo.json), and\n\t  <a href=\"https://codemeta.github.io/\">CodeMeta</a> (codemeta.json)\
  \ files in one\n\t  go, using a shared <code>.tributors</code> cache that maps GitHub logins to\n\t\
  \  ORCID iDs and other persistent identifiers — so that contributor records\n\t  stay consistent and\
  \ up-to-date across all metadata files with a single command.\n\t  For example, DataLad uses a\n\t \
  \ <a href=\"https://github.com/datalad/datalad/blob/master/.github/workflows/update-contributors.yml\"\
  >dedicated\n\t  GitHub Actions workflow</a> powered by con/tributors to automatically\n\t  keep its\
  \ contributor files current.\n\t</p>\n  "
row_html: "<div class=\"row\">\n\t<h2>con/tributors</h2>\n\t<figure>\n      <a href=\"https://con.github.io/tributors/\"\
  >\n\t\t<img src=\"/theme/img/3rd/tributors_logo.png\" alt=\"tributors\"\n\t\t\t class=\"pull-right\"\
  \n\t\t\t style=\"width:120px;padding-left:5px;margin-top:-1em;\" />\n\t  </a>\n    </figure>\n\t<p>\n\
  \t  <a href=\"https://github.com/con/tributors\">con/tributors</a> is a Python library\n\t  and GitHub\
  \ Action to automate maintenance of contributor attribution files.\n\t  It updates <a href=\"https://allcontributors.org\"\
  >all-contributors</a>,\n\t  <a href=\"https://zenodo.org\">Zenodo</a> metadata (.zenodo.json), and\n\
  \t  <a href=\"https://codemeta.github.io/\">CodeMeta</a> (codemeta.json) files in one\n\t  go, using\
  \ a shared <code>.tributors</code> cache that maps GitHub logins to\n\t  ORCID iDs and other persistent\
  \ identifiers — so that contributor records\n\t  stay consistent and up-to-date across all metadata\
  \ files with a single command.\n\t  For example, DataLad uses a\n\t  <a href=\"https://github.com/datalad/datalad/blob/master/.github/workflows/update-contributors.yml\"\
  >dedicated\n\t  GitHub Actions workflow</a> powered by con/tributors to automatically\n\t  keep its\
  \ contributor files current.\n\t</p>\n  </div>"
